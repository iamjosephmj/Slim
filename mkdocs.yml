site_name: Slim
site_url: https://iamjosephmj.github.io/Slim/
site_description: Pure-Kotlin ARM64 NEON runtime for Android — write SIMD inline in Kotlin, run at native throughput.
site_author: iamjosephmj
repo_url: https://github.com/iamjosephmj/Slim
repo_name: iamjosephmj/Slim
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 iamjosephmj. Apache-2.0.

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  font:
    text: Inter
    code: JetBrains Mono

nav:
  - Home: index.md
  - Guide:
      - guide/index.md
      - 1. Introduction: guide/introduction.md
  - Cookbook: COOKBOOK.md
  - Architecture: ARCHITECTURE.md
  - Contributing: CONTRIBUTING.md

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.smartsymbols

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/iamjosephmj/Slim
    - icon: fontawesome/solid/cube
      link: https://jitpack.io/#iamjosephmj/Slim
      name: JitPack
